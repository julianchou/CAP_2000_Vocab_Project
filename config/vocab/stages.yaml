stages:
  - id: "1"
    key: "stage1_vocab_prep"
    name: "單字與摘要準備"
    steps:
      - name: "No.3 產生單字資料"
        type: python
        script: scripts/generate_vocab_content.py
        args: ["--ep", "{ep}", "--provider", "auto"]
      - name: "No.4 產生單字卡"
        type: python
        script: scripts/generate_flashcards.py
        args: ["--ep", "{ep}"]
      - name: "No.5 產生克漏字題"
        type: python
        script: scripts/generate_cloze_quiz.py
        args: ["--ep", "{ep}", "--provider", "auto"]
      - name: "No.6 產生克漏字卡"
        type: python
        script: scripts/generate_cloze_flashcards.py
        args: ["--ep", "{ep}"]
      - name: "No.7 產生封面"
        type: python
        script: scripts/generate_cover.py
        args: ["--ep", "{ep}", "--start_idx", "{start}", "--end_idx", "{end}"]
        optional: true
      - name: "No.8 產生語音摘要 Prompt"
        type: python
        script: scripts/generate_notebooklm_prompt.py
        args: ["--ep", "{ep}"]

  - id: "2"
    key: "stage2_subtitles"
    name: "字幕處理"
    steps:
      - name: "No.10.5 合併片頭音訊"
        type: python
        script: scripts/merge_intro_audio.py
        args: ["--ep", "{ep}"]
        optional: true
      - name: "No.11 Whisper 產生字幕"
        type: python
        script: scripts/generate_subtitles_only.py
        args: ["--ep", "{ep}"]
      - name: "No.12 AI 字幕校對"
        type: python
        script: scripts/llm_subtitle_reviewer.py
        args: ["--ep", "{ep}", "--provider", "openai"]

  - id: "3"
    key: "stage3_storyboard"
    name: "分鏡規劃"
    steps:
      - name: "No.14 AI 依語境分鏡規劃"
        type: python
        script: scripts/llm_director.py
        args: ["--ep", "{ep}", "--provider", "openai"]

  - id: "4"
    key: "stage4_images"
    name: "產生分鏡圖片"
    steps:
      - name: "No.16 AI 產生分鏡圖片"
        type: python
        script: scripts/gen_matched_preview_v4.py
        args: ["--ep", "{ep}", "--provider", "nvidia"]

  - id: "5"
    key: "stage5_render"
    name: "影片合成"
    steps:
      - name: "No.18 產生合成清單"
        type: python
        script: scripts/gen_matched_preview_v4.py
        args: ["--ep", "{ep}"]
      - name: "No.19 FFmpeg 影片合成"
        type: python
        script: run_stage6_render.py
        args: ["--ep", "{ep}"]
      - name: "No.20 產生 Youtube metadata"
        type: python
        script: scripts/generate_youtube_meta.py
        args: ["--ep", "{ep}"]

  - id: "6"
    key: "stage6_publish"
    name: "上傳 YouTube"
    steps:
      - name: "No.21 上傳 Youtube"
        type: python
        script: scripts/upload_to_youtube.py
        args: ["--ep", "{ep}"]
        optional: true
