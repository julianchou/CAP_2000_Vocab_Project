substeps:
  - no: "3"
    key: "step03_vocab_content"
    name: "產生單字資料"
    rule: all
    outputs:
      - pattern: "03_storyboards/vocab_data.csv"
        nonempty: true
      - pattern: "03_storyboards/vocab_data.json"
        nonempty: true
    run:
      type: python
      script: scripts/generate_vocab_content.py
      args: ["--ep", "{ep}", "--provider", "auto"]

  - no: "4"
    key: "step04_flashcards"
    name: "產生單字卡"
    rule: any
    outputs:
      - pattern: "04_images/flashcards/*.*"
    run:
      type: python
      script: scripts/generate_flashcards.py
      args: ["--ep", "{ep}"]

  - no: "5"
    key: "step05_cloze_questions"
    name: "產生克漏字題"
    rule: all
    outputs:
      - pattern: "03_storyboards/cloze_questions.csv"
        nonempty: true
      - pattern: "03_storyboards/cloze_questions.json"
        nonempty: true
    run:
      type: python
      script: scripts/generate_cloze_quiz.py
      args: ["--ep", "{ep}", "--provider", "auto"]

  - no: "6"
    key: "step06_cloze_flashcards"
    name: "產生克漏字卡"
    rule: all
    outputs:
      - pattern: "04_images/cloze_cards/questions/*.png"
      - pattern: "04_images/cloze_cards/answers/*.png"
    run:
      type: python
      script: scripts/generate_cloze_flashcards.py
      args: ["--ep", "{ep}"]

  - no: "7"
    key: "step07_cover"
    name: "產生封面"
    rule: any
    outputs:
      - pattern: "04_images/cover.png"
        nonempty: true
    run:
      type: python
      script: scripts/generate_cover.py
      args: ["--ep", "{ep}", "--start_idx", "{start}", "--end_idx", "{end}"]

  - no: "8"
    key: "step08_prompt"
    name: "產生語音摘要 Prompt"
    rule: any
    outputs:
      - pattern: "notebooklm_prompt_ep*.txt"
        nonempty: true
    run:
      type: python
      script: scripts/generate_notebooklm_prompt.py
      args: ["--ep", "{ep}"]

  - no: "9"
    key: "step09_tts_generate"
    name: "人工到 NotebookLM 產生語音摘要"
    rule: any
    outputs:
      - pattern: "00_logs/step09_manual_done.txt"
      - pattern: "00_logs/step9_manual_done.txt"

  - no: "10"
    key: "step10_audio_upload"
    name: "上傳語音音訊"
    rule: any
    outputs:
      - pattern: "01_audio/notebooklm_audio.m4a"
        nonempty: true

  - no: "10.5"
    key: "step10_5_merge_intro"
    name: "合併片頭音訊"
    rule: all
    outputs:
      - pattern: "01_audio/notebooklm_audio.m4a"
        nonempty: true
      - pattern: "00_logs/step10_5_intro_merged.txt"
        nonempty: true
    run:
      type: python
      script: scripts/merge_intro_audio.py
      args: ["--ep", "{ep}"]

  - no: "11"
    key: "step11_subtitles_raw"
    name: "Whisper 產生字幕"
    rule: any
    outputs:
      - pattern: "02_subtitles/notebooklm_audio.srt"
        nonempty: true
    run:
      type: python
      script: scripts/generate_subtitles_only.py
      args: ["--ep", "{ep}"]

  - no: "12"
    key: "step12_subtitles_fix"
    name: "AI 字幕校對"
    rule: any
    outputs:
      - pattern: "02_subtitles/notebooklm_audio_fixed.srt"
        nonempty: true
    run:
      type: python
      script: scripts/llm_subtitle_reviewer.py
      args: ["--ep", "{ep}", "--provider", "openai"]

  - no: "13"
    key: "step13_subtitles_manual"
    name: "人工字幕確認"
    rule: all
    outputs:
      - pattern: "02_subtitles/notebooklm_audio_fixed.srt"
        nonempty: true
      - pattern: "00_logs/step13_manual_done.txt"

  - no: "14"
    key: "step14_storyboard_ai"
    name: "AI 依語境分鏡規劃"
    rule: any
    outputs:
      - pattern: "03_storyboards/storyboard.csv"
        nonempty: true
    run:
      type: python
      script: scripts/llm_director.py
      args: ["--ep", "{ep}", "--provider", "openai"]

  - no: "15"
    key: "step15_storyboard_manual"
    name: "人工微調分鏡"
    rule: all
    outputs:
      - pattern: "03_storyboards/storyboard.csv"
        nonempty: true
      - pattern: "00_logs/step15_manual_done.txt"

  - no: "16"
    key: "step16_preview_images"
    name: "AI 產生分鏡圖片"
    rule: any
    outputs:
      - pattern: "04_images/preview_images/*.*"
      - pattern: "04_images/ai_generated/*.png"
    run:
      type: python
      script: scripts/gen_matched_preview_v4.py
      args: ["--ep", "{ep}", "--provider", "nvidia"]

  - no: "17"
    key: "step17_outro"
    name: "片尾製作"
    rule: all
    outputs:
      - pattern: "05_output/outro/outro_config.json"
        nonempty: true
      - pattern: "05_output/outro/outro_media.*"
        nonempty: true

  - no: "18"
    key: "step18_inputs_list"
    name: "產生合成清單"
    rule: any
    outputs:
      - pattern: "05_output/inputs.txt"
        nonempty: true
    run:
      type: python
      script: scripts/gen_matched_preview_v4.py
      args: ["--ep", "{ep}"]

  - no: "19"
    key: "step19_render"
    name: "FFmpeg 影片合成"
    rule: any
    outputs:
      - pattern: "05_output/final_video.mp4"
        nonempty: true
    run:
      type: python
      script: run_stage6_render.py
      args: ["--ep", "{ep}"]

  - no: "20"
    key: "step20_youtube_meta"
    name: "產生 Youtube metadata"
    rule: any
    outputs:
      - pattern: "05_output/youtube_meta.json"
        nonempty: true
    run:
      type: python
      script: scripts/generate_youtube_meta.py
      args: ["--ep", "{ep}"]

  - no: "21"
    key: "step21_upload_youtube"
    name: "上傳 Youtube"
    rule: any
    outputs:
      - pattern: "05_output/upload.ok"
        nonempty: true
